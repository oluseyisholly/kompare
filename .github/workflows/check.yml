name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: disposable-ci-signing-key-only-never-used-in-deployment
      ENABLE_INGESTION_SCHEDULER: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install uv==0.13.7
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint and format
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Verify secrets stay untracked
        run: test -z "$(git ls-files -- .env '.env.*' ':!.env.example')"
      - name: Audit locked runtime packages
        run: |
          uv export --locked --no-dev --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r /tmp/runtime-requirements.txt
      - name: PostgreSQL tools
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Migration rehearsal and all regressions
        run: uv run scripts/test-postgres.sh
      - name: Build runtime and test images
        run: |
          docker build --target production -t kompare-runtime .
          docker build --target test -t kompare-tests .
          docker run --rm kompare-tests
